<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хвеш | Портфолио :3 </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: rgba(20, 20, 20, 0.55);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      --card-shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --text-primary: #fff;
      --text-secondary: rgba(255, 255, 255, 0.5);
      --text-tertiary: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.25);
      --text-faint: rgba(255, 255, 255, 0.2);
      --text-skill: rgba(255, 255, 255, 0.7);
      --text-contact: rgba(255, 255, 255, 0.8);
      --avatar-bg: linear-gradient(135deg, #333, #111);
      --avatar-border: rgba(255, 255, 255, 0.08);
      --avatar-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --skill-bg: rgba(255, 255, 255, 0.06);
      --skill-border: rgba(255, 255, 255, 0.06);
      --skill-hover-bg: rgba(255, 255, 255, 0.12);
      --skill-hover-border: rgba(255, 255, 255, 0.15);
      --contact-bg: rgba(255, 255, 255, 0.04);
      --contact-border: rgba(255, 255, 255, 0.06);
      --contact-hover-bg: rgba(255, 255, 255, 0.1);
      --contact-hover-border: rgba(255, 255, 255, 0.15);
      --hr-color: rgba(255, 255, 255, 0.06);
      --stat-label: rgba(255, 255, 255, 0.35);
      --liquid-1: #fff;
      --liquid-2: #aaa;
      --liquid-3: #555;
      --liquid-opacity: 0.15;
      --toggle-border: rgba(255, 255, 255, 0.15);
      --toggle-hover-bg: rgba(255, 255, 255, 0.08);
      --svg-invert: none;
      --js-icon-bg: #fff;
    }

    [data-theme="light"] {
      --bg: #f0f0f0;
      --card-bg: rgba(255, 255, 255, 0.6);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
      --card-shadow-inset: inset 0 1px 0 rgba(255, 255, 255, 0.7);
      --text-primary: #111;
      --text-secondary: rgba(0, 0, 0, 0.45);
      --text-tertiary: rgba(0, 0, 0, 0.6);
      --text-muted: rgba(0, 0, 0, 0.25);
      --text-faint: rgba(0, 0, 0, 0.2);
      --text-skill: rgba(0, 0, 0, 0.65);
      --text-contact: rgba(0, 0, 0, 0.75);
      --avatar-bg: linear-gradient(135deg, #ddd, #bbb);
      --avatar-border: rgba(0, 0, 0, 0.08);
      --avatar-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      --skill-bg: rgba(0, 0, 0, 0.04);
      --skill-border: rgba(0, 0, 0, 0.06);
      --skill-hover-bg: rgba(0, 0, 0, 0.08);
      --skill-hover-border: rgba(0, 0, 0, 0.12);
      --contact-bg: rgba(0, 0, 0, 0.03);
      --contact-border: rgba(0, 0, 0, 0.06);
      --contact-hover-bg: rgba(0, 0, 0, 0.06);
      --contact-hover-border: rgba(0, 0, 0, 0.1);
      --hr-color: rgba(0, 0, 0, 0.08);
      --stat-label: rgba(0, 0, 0, 0.35);
      --liquid-1: #888;
      --liquid-2: #555;
      --liquid-3: #ccc;
      --liquid-opacity: 0.1;
      --toggle-border: rgba(0, 0, 0, 0.15);
      --toggle-hover-bg: rgba(0, 0, 0, 0.06);
      --svg-invert: invert(1);
      --js-icon-bg: #0a0a0a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      transition: background 0.4s ease;
    }

    .bg-liquid {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-liquid span {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: liquid 12s ease-in-out infinite alternate;
      transition: background 0.6s ease, opacity 0.6s ease;
    }

    .bg-liquid span:nth-child(1) {
      width: 400px; height: 400px;
      background: var(--liquid-1);
      top: -10%; left: -5%;
      animation-duration: 14s;
      opacity: var(--liquid-opacity);
    }

    .bg-liquid span:nth-child(2) {
      width: 350px; height: 350px;
      background: var(--liquid-2);
      top: 60%; right: -8%;
      animation-duration: 10s;
      animation-delay: -3s;
      opacity: var(--liquid-opacity);
    }

    .bg-liquid span:nth-child(3) {
      width: 300px; height: 300px;
      background: var(--liquid-3);
      bottom: -5%; left: 30%;
      animation-duration: 16s;
      animation-delay: -6s;
      opacity: var(--liquid-opacity);
    }

    @keyframes liquid {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      25% { transform: translate(40px, -60px) scale(1.15) rotate(90deg); }
      50% { transform: translate(-30px, 40px) scale(0.9) rotate(180deg); }
      75% { transform: translate(50px, 30px) scale(1.1) rotate(270deg); }
      100% { transform: translate(-40px, -50px) scale(0.95) rotate(360deg); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 48px 40px;
      box-shadow: var(--card-shadow), var(--card-shadow-inset);
      transition: transform 0.3s ease, background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 28px;
      background: var(--avatar-bg);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      color: var(--text-primary);
      border: 1px solid var(--avatar-border);
      box-shadow: var(--avatar-shadow);
      user-select: none;
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 36px;
      color: var(--text-primary);
      text-align: center;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      transition: color 0.4s ease;
    }

    .subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.3px;
      margin-bottom: 32px;
      transition: color 0.4s ease;
    }

    .bio {
      color: var(--text-tertiary);
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
      margin-bottom: 32px;
      padding: 0 4px;
      transition: color 0.4s ease;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 32px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--text-primary);
      transition: color 0.4s ease;
    }

    .stat-label {
      font-size: 12px;
      color: var(--stat-label);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
      transition: color 0.4s ease;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .skill {
      background: var(--skill-bg);
      border: 1px solid var(--skill-border);
      border-radius: 100px;
      padding: 8px 18px;
      font-size: 13px;
      color: var(--text-skill);
      transition: all 0.25s ease, background 0.4s ease, border-color 0.4s ease;
    }

    .skill:hover {
      background: var(--skill-hover-bg);
      border-color: var(--skill-hover-border);
      color: var(--text-primary);
      transform: scale(1.04);
    }

    .contacts {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--contact-border);
      background: var(--contact-bg);
      color: var(--text-contact);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.25s ease, background 0.4s ease, border-color 0.4s ease;
      cursor: pointer;
      font-family: inherit;
    }

    .contact-btn:hover {
      background: var(--contact-hover-bg);
      border-color: var(--contact-hover-border);
      color: var(--text-primary);
      transform: scale(1.02);
    }

    .contact-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-faint);
      transition: color 0.4s ease;
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 16px;
      transition: color 0.4s ease;
    }

    hr {
      border: none;
      border-top: 1px solid var(--hr-color);
      margin: 28px 0;
      transition: border-color 0.4s ease;
    }

    .toggle-theme {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      border: 1px solid var(--toggle-border);
      background: var(--contact-bg);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease, background 0.4s ease, border-color 0.4s ease;
      font-size: 18px;
      z-index: 2;
    }

    .toggle-theme:hover {
      background: var(--toggle-hover-bg);
      color: var(--text-primary);
      transform: scale(1.08);
    }

    .toggle-theme svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .skill svg {
      transition: filter 0.4s ease;
    }

    [data-theme="light"] .skill svg {
      filter: var(--svg-invert);
    }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; border-radius: 24px; }
      h1 { font-size: 28px; }
      .stats { gap: 20px; }
    }
  </style>
</head>

  <script>
    const toggle = document.getElementById('themeToggle');
    const sun = document.getElementById('sunIcon');
    const moon = document.getElementById('moonIcon');

    const saved = localStorage.getItem('theme');
    if (saved === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      sun.style.display = 'none';
      moon.style.display = '';
    }

    toggle.addEventListener('click', () => {
      const html = document.documentElement;
      const isLight = html.getAttribute('data-theme') === 'light';
      if (isLight) {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
        sun.style.display = '';
        moon.style.display = 'none';
      } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        sun.style.display = 'none';
        moon.style.display = '';
      }
    });
  </script>
